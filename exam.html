<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সাপ্তাহিক পরীক্ষা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--bg2:#0d1426;--card:#111a30;--line:rgba(212,175,55,.25);--gold:#e6c65c;--gold2:#b8912a;--tx:#eef1f8;--mu:#9aa6c2;--ok:#7ee0a0;--bad:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;line-height:1.65;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top a{color:var(--gold);text-decoration:none}
h1{font-size:24px;margin:6px 0 12px;color:var(--gold)}
h2{font-size:19px;line-height:1.5;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card p{color:var(--mu);font-size:15px;margin:3px 0}
.card b{color:var(--tx)}
input,select,textarea{width:100%;padding:12px 14px;margin:4px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px;outline:none}
textarea{min-height:240px;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{font-size:13.5px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{width:100%;border:0;padding:13px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;font-weight:700;font-size:16px;margin-top:6px}
.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:7px 16px;font-size:14px}
.gb{width:100%;padding:13px;border-radius:99px;border:0;background:#fff;color:#222;font-weight:600;font-size:16px;margin-bottom:12px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;border-radius:11px;font-weight:600}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700}
.y{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.n{background:rgba(255,138,138,.15);color:var(--bad);border:1px solid rgba(255,138,138,.3)!important}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);color:var(--gold)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;color:var(--gold);text-align:center;margin:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mu)}
.bar b{font-size:30px;color:var(--gold)}
.pg{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.pg i{display:block;height:100%;background:var(--gold);width:100%}
.st{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.st p{margin-bottom:10px;font-size:16px}
.tf{display:flex;gap:8px}
.tf button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-weight:600}
.tf button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;border-color:transparent}
.ex{user-select:none;-webkit-user-select:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#1a1300;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:9}
a.tel{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{font-size:12.5px;color:var(--mu)}
small.h{display:block;color:var(--mu);font-size:12.5px;margin:-6px 0 10px}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocFromServer,getDocs,setDoc,updateDoc,collection,query,orderBy,limit,where,serverTimestamp,Timestamp,increment,arrayUnion,writeBatch,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== এখানে আপনার index.html এর firebaseConfig বসান ====== */
const firebaseConfig = {
  apiKey:"AIzaSyBOcqP74z2N5bxTKes4xfQmsPW5eGk5R0s",
  authDomain:"cornea-help-center.firebaseapp.com",
  projectId:"cornea-help-center",
  storageBucket:"cornea-help-center.firebasestorage.app",
  messagingSenderId:"755555154486",
  appId:"1:755555154486:web:df02dec5573a7a9f203697"
};
const ADMIN_EMAIL="tanvirahmedsifat8@gmail.com";
/* ================================================================ */

const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const S={user:null,isAdmin:false,off:0,exam:null,mode:'',tk:null};
const AD={tab:'dash',exams:[],id:null};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.off;
const fmt=ms=>new Date(ms).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'});
const loc=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const hash=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(arr,r)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const norm=d=>({...d.data(),id:d.id,s:d.data().startAt.toMillis(),en:d.data().endAt.toMillis()});
const act={};
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b)});
const val=id=>($('#'+id)?.value||'').trim();

/* ---------- লগইন ---------- */
function loginView(){
  clearInterval(S.tk);
  app.innerHTML=`<h1>সাপ্তাহিক পরীক্ষা</h1><div class="card"><button class="gb" data-a="google">Google দিয়ে লগইন</button>
  <label>ইমেইল</label><input id="em" type="email" autocomplete="email"><label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" data-a="emlogin">ইমেইলে লগইন</button><button class="ghost" style="margin-top:10px;width:100%" data-a="emreg">নতুন অ্যাকাউন্ট খুলুন</button><div class="err" id="er"></div></div>`;
}
const fail=e=>{const x=$('#er');if(x)x.textContent=e.message;else toast(e.message)};
act.google=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
act.emlogin=()=>signInWithEmailAndPassword(auth,val('em'),val('pw')).catch(fail);
act.emreg=()=>createUserWithEmailAndPassword(auth,val('em'),val('pw')).catch(fail);
act.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  S.user=u;if(!u)return loginView();
  try{
    await setDoc(doc(db,'ping',u.uid),{t:serverTimestamp()});
    const p=await getDocFromServer(doc(db,'ping',u.uid));
    S.off=p.data().t.toMillis()-Date.now();
    const ad=await getDoc(doc(db,'admins',u.uid)),own=(u.email||'').toLowerCase()===ADMIN_EMAIL;S.isAdmin=own||ad.exists();S.role=own?'owner':(ad.data()?.role||'owner');
    await loadExam();
    (S.isAdmin&&S.mode!=='student')?adminView():home();
  }catch(e){app.innerHTML=`<div class="card"><p>লোড করা যায়নি: ${esc(e.message)}</p></div>`}
});
async function loadExam(){
  const q=await getDocs(query(collection(db,'exams'),orderBy('startAt','desc'),limit(1)));
  S.exam=q.empty?null:norm(q.docs[0]);
}

/* ---------- শিক্ষার্থী হোম ---------- */
async function home(){
  clearInterval(S.tk);
  const u=S.user,e=S.exam;
  let h=`<div class="top"><a href="/">← হোম</a><span>${S.isAdmin?'<button class="ghost" data-a="toadm">অ্যাডমিন</button> ':''}<button class="ghost" data-a="logout">লগআউট</button></span></div><h1>সাপ্তাহিক পরীক্ষা</h1>`;
  if(!e){app.innerHTML=h+`<div class="card"><p>এখনো কোনো পরীক্ষা ঘোষণা হয়নি।</p></div>`;return}
  const aid=e.id+'_'+u.uid;
  const [ap,at]=await Promise.all([getDoc(doc(db,'apps',aid)),getDoc(doc(db,'attempts',aid))]);
  let stu=null;if(!ap.exists()){try{const sd=await getDoc(doc(db,'students',u.uid));stu=sd.exists()?sd.data():null}catch(_){}}
  h+=`<div class="card"><h2>${esc(e.title)}</h2><p>শুরু: <b>${fmt(e.s)}</b></p><p>শেষ: <b>${fmt(e.en)}</b></p><p>প্রশ্ন: <b>${bn(e.qCount||0)}টি</b> · প্রতি প্রশ্ন সর্বোচ্চ <b>${bn(e.secPerQ)} সেকেন্ড</b></p></div>`;
  if(!ap.exists()&&(!stu||stu.status!=='approved')){
    h+=`<div class="card"><p>পরীক্ষার আবেদনের আগে মূল সাইটে আইডি কার্ড যাচাই (KYC) সম্পন্ন ও অনুমোদিত হতে হবে।</p><p><a class="tel" href="/">মূল সাইটে যান</a></p></div>`;
  }else if(!ap.exists()){
    h+= now()<e.en ? `<div class="card"><h2>পরীক্ষার আবেদন</h2>
    <label>পূর্ণ নাম</label><input id="f_name" value="${esc(stu?.name||u.displayName||'')}">
    <label>মোবাইল নম্বর</label><input id="f_phone" type="tel" inputmode="tel" value="${esc(stu?.mobile||'')}">
    <label>প্রতিষ্ঠান / কলেজ</label><input id="f_inst" value="${esc(stu?.department||'')}">
    <label>ব্যাচ / বর্ষ</label><input id="f_batch" value="${esc(stu?.session||'')}">
    <button class="btn" data-a="apply">আবেদন করুন</button><div class="err" id="er"></div></div>`
    : `<div class="card"><p>এই পরীক্ষার আবেদনের সময় শেষ।</p></div>`;
  }else{
    const st=ap.data().status;
    if(st==='pending')h+=`<div class="card"><span class="tag">যাচাই চলছে</span><p style="margin-top:8px">আপনার আবেদন জমা হয়েছে। অ্যাডমিন যাচাই করে অনুমোদন দিলে এখানে পরীক্ষা শুরুর বাটন আসবে।</p></div>`;
    else if(st==='rejected')h+=`<div class="card"><span class="tag bad">আবেদন গৃহীত হয়নি</span></div>`;
    else{
      const A=at.exists()?at.data():null;
      if(A&&(A.done||A.failed||now()>=e.en)){
        if(e.resultsPublished){
          let r=null;try{const rd=await getDoc(doc(db,'results',aid));r=rd.exists()?rd.data():null}catch(_){}
          h+= r? `<div class="card"><p style="text-align:center">আপনার প্রাপ্ত নম্বর</p><div class="big">${bn(r.score)} / ${bn(e.qCount||0)}</div>${r.failed?'<p style="text-align:center;color:var(--bad)">বাতিল</p>':''}</div>`
              : `<div class="card"><p>ফলাফল পাওয়া যায়নি।</p></div>`;
        }else h+=`<div class="card"><span class="tag ok">${A?'পরীক্ষা জমা হয়েছে':'সময় শেষ'}</span><p style="margin-top:8px">ফলাফল প্রকাশের অপেক্ষা করুন।</p></div>`;
      }else if(now()<e.s){
        h+=`<div class="card"><span class="tag ok">অনুমোদিত</span><p style="margin-top:8px">পরীক্ষা শুরু হতে বাকি</p><div class="big" id="cd"></div></div>`;
        S.tk=setInterval(()=>{const l=e.s-now();if(l<=0){clearInterval(S.tk);home()}else{const c=$('#cd');if(c)c.textContent=bn(Math.floor(l/36e5))+':'+bn(String(Math.floor(l/6e4)%60).padStart(2,'0'))+':'+bn(String(Math.floor(l/1e3)%60).padStart(2,'0'))}},500);
      }else{
        h+=`<div class="card"><span class="tag ok">পরীক্ষা চলছে</span><p style="margin:8px 0">শেষ হবে ${fmt(e.en)}। একবার পরের প্রশ্নে গেলে আগের প্রশ্নে ফেরা যাবে না। অন্য ট্যাব বা অ্যাপে গেলে তা রেকর্ড হবে।</p><button class="btn" data-a="start">${A?'চালিয়ে যান':'পরীক্ষা শুরু করুন'}</button></div>`;
      }
    }
  }
  app.innerHTML=h;profile();
}
async function profile(){
  const e=S.exam,div=document.createElement('div');app.appendChild(div);let h='';
  try{
    const q=await getDocs(query(collection(db,'results'),where('uid','==',S.user.uid),where('published','==',true)));
    const L=q.docs.map(d=>d.data()).sort((a,b)=>a.at-b.at);
    if(L.length)h+=`<div class="card"><h2>আমার ফলাফলের ইতিহাস</h2><p>গড় নম্বর: <b>${bn((L.reduce((s,x)=>s+x.score,0)/L.length).toFixed(2))}</b> · পরীক্ষা: <b>${bn(L.length)}টি</b></p><div style="display:flex;align-items:flex-end;gap:6px;height:100px;margin-top:10px">`+
      L.slice(-10).map(x=>`<div style="flex:1;text-align:center"><div style="background:var(--gold);height:${Math.max(3,Math.round(x.score/(x.max||30)*70))}px;border-radius:6px 6px 0 0"></div><small style="font-size:11px;color:var(--mu)">${bn(x.score)}</small></div>`).join('')+`</div></div>`;
  }catch(_){}
  if(e&&e.resultsPublished&&e.board)try{
    const q=await getDocs(query(collection(db,'results'),where('examId','==',e.id),where('published','==',true),where('board','==',true)));
    const L=q.docs.map(d=>d.data()).filter(x=>!x.failed).sort((a,b)=>b.score-a.score).slice(0,10);
    if(L.length)h+=`<div class="card"><h2>মেধাতালিকা</h2>`+L.map((x,i)=>`<p><b>${bn(i+1)}.</b> ${esc(x.name||'—')} <span style="float:right;color:var(--gold)">${bn(x.score)}</span></p>`).join('')+`</div>`;
  }catch(_){}
  if(e&&e.resultsPublished&&e.review)h+=`<button class="btn" data-a="review">উত্তর রিভিউ দেখুন</button>`;
  div.innerHTML=h;
}
act.review=async()=>{
  try{
    const e=S.exam,[r,a]=await Promise.all([getDoc(doc(db,'exams',e.id,'review','main')),getDoc(doc(db,'attempts',e.id+'_'+S.user.uid))]);
    const it=r.data().items,A=a.data().ans||{};
    app.innerHTML=`<div class="top"><button class="ghost" data-a="back">← ফিরুন</button></div><h1>উত্তর রিভিউ</h1>`+it.map((q,i)=>{const u=A[i]||'-----';
      return `<div class="card"><h2>${bn(i+1)}. ${esc(q.t)}</h2>`+q.s.map((t,j)=>{const c=u[j]==='-'?null:u[j]==='T',k=q.k[j]==='1';
        return `<p style="color:${c===null?'var(--mu)':c===k?'var(--ok)':'var(--bad)'}">${esc(t)}<br>সঠিক: ${k?'সত্য':'মিথ্যা'} · আপনার: ${c===null?'উত্তর নেই':c?'সত্য':'মিথ্যা'}</p>`}).join('')+`</div>`}).join('');
  }catch(_){toast('রিভিউ পাওয়া যায়নি')}
};
act.back=()=>home();
act.toadm=()=>{S.mode='';adminView()};
act.apply=async b=>{
  const d={name:val('f_name'),phone:val('f_phone'),inst:val('f_inst'),batch:val('f_batch')};
  if(!d.name||d.phone.length<11){$('#er').textContent='নাম এবং সঠিক মোবাইল নম্বর দিন।';return}
  b.disabled=true;
  try{await setDoc(doc(db,'apps',S.exam.id+'_'+S.user.uid),{...d,uid:S.user.uid,email:S.user.email||'',examId:S.exam.id,status:'pending',createdAt:serverTimestamp()});toast('আবেদন জমা হয়েছে');home()}
  catch(e){b.disabled=false;$('#er').textContent=e.message}
};

/* ---------- পরীক্ষা ---------- */
act.start=()=>{
  app.innerHTML=`<h1>পরীক্ষার নিয়ম</h1><div class="card"><p>১. প্রতি প্রশ্নের সময় শেষ হলে নিজে পরের প্রশ্নে চলে যাবে।</p><p>২. পরের প্রশ্নে গেলে আগের প্রশ্নে ফেরা যাবে না।</p><p>৩. পরীক্ষা ফুলস্ক্রিনে চলবে। ফুলস্ক্রিন থেকে বের হলে বা অন্য ট্যাব/অ্যাপে গেলে রেকর্ড হবে।</p><p>৪. সন্দেহ হলে অ্যাডমিন ফলাফল বাতিল করতে পারবেন।</p><p>৫. শেষ সময়ের পর কোনো উত্তর নেওয়া হবে না।</p>
  <label style="display:flex;gap:10px;align-items:center;margin-top:14px;color:var(--tx)"><input type="checkbox" id="ag" style="width:auto;margin:0"> আমি সব নিয়ম মেনে চলব</label><button class="btn" data-a="go">শুরু করুন</button></div>`;
};
act.go=async()=>{
  if(!$('#ag')?.checked)return toast('নিয়মে সম্মতি দিন');
  try{await document.documentElement.requestFullscreen()}catch(_){}
  const e=S.exam,id=e.id+'_'+S.user.uid,ref=doc(db,'attempts',id);
  let a=await getDoc(ref);
  if(!a.exists()){
    await setDoc(ref,{uid:S.user.uid,examId:e.id,name:S.user.displayName||'',startedAt:serverTimestamp(),qStart:serverTimestamp(),idx:0,ans:{},flags:0,done:false,failed:false});
    a=await getDocFromServer(ref);
  }
  const A=a.data();if(A.done||A.failed)return home();
  const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data().items,n=qs.length;
  const r=rng(hash(id)),order=shuf([...qs.keys()],r),sord=qs.map(()=>shuf([0,1,2,3,4],r));
  let idx=A.idx,qMs=A.qStart.toMillis(),cur=[],last=0,over=false;
  const per=e.secPerQ*1000;
  const flag=()=>{if(over||Date.now()-last<1500)return;last=Date.now();
    updateDoc(ref,{flags:increment(1),log:arrayUnion('প্রশ্ন'+(idx+1)+' @'+new Date(now()).toISOString().slice(11,19))}).catch(()=>{})};
  const vis=()=>{if(document.hidden||(document.fullscreenEnabled&&!document.fullscreenElement))flag()};
  const stop=ev=>ev.preventDefault();
  document.addEventListener('visibilitychange',vis);document.addEventListener('fullscreenchange',vis);window.addEventListener('blur',flag);
  ['contextmenu','copy','cut','paste'].forEach(t=>document.addEventListener(t,stop));
  const cleanup=()=>{over=true;try{document.fullscreenElement&&document.exitFullscreen()}catch(_){}document.removeEventListener('fullscreenchange',vis);clearInterval(S.tk);document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',flag);['contextmenu','copy','cut','paste'].forEach(t=>document.removeEventListener(t,stop))};
  const finish=async()=>{cleanup();try{await updateDoc(ref,{done:true,doneAt:serverTimestamp()})}catch(_){}home()};
  const next=async()=>{
    clearInterval(S.tk);idx++;
    if(idx>=n)return finish();
    updateDoc(ref,{idx,qStart:serverTimestamp()}).catch(()=>{});qMs=now();show();
  };
  function show(){
    const q=order[idx],it=qs[q],so=sord[q];
    cur=(A.ans[q]&&idx===A.idx?A.ans[q]:'-----').split('');
    app.innerHTML=`<div class="ex"><div class="bar"><span>প্রশ্ন ${bn(idx+1)} / ${bn(n)}</span><b id="tm"></b></div><div class="pg"><i id="pb"></i></div><h2>${esc(it.t)}</h2>`+
      so.map(si=>`<div class="st"><p>${esc(it.s[si])}</p><div class="tf" data-i="${si}"><button data-v="T" class="${cur[si]==='T'?'on':''}">সত্য</button><button data-v="F" class="${cur[si]==='F'?'on':''}">মিথ্যা</button></div></div>`).join('')+
      `<button class="btn" id="nx">${idx===n-1?'জমা দিন':'পরের প্রশ্ন'}</button></div>`;
    app.querySelectorAll('.tf button').forEach(bt=>bt.onclick=()=>{
      const i=+bt.parentNode.dataset.i,v=bt.dataset.v;cur[i]=cur[i]===v?'-':v;
      bt.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===cur[i]));
      updateDoc(ref,{['ans.'+q]:cur.join('')}).catch(()=>{});
    });
    $('#nx').onclick=next;
    clearInterval(S.tk);
    S.tk=setInterval(()=>{
      const left=Math.min(per-(now()-qMs),e.en-now());
      if(e.en-now()<=0)return finish();
      if(left<=0)return next();
      $('#tm').textContent=bn(Math.ceil(left/1000))+' সে.';$('#pb').style.width=Math.max(0,left/per*100)+'%';
    },250);
  }
  if(now()>=e.en||idx>=n)return finish();
  show();
};

function parseQ(t){
  return t.trim().split(/\n\s*\n/).map(b=>{
    const L=b.trim().split('\n').map(x=>x.trim()).filter(Boolean);
    if(L.length!==6)throw new Error('প্রতি প্রশ্নে ১টি প্রশ্ন ও ৫টি স্টেটমেন্ট লাগবে: '+L[0]);
    const s=[],k=[];
    L.slice(1).forEach(l=>{const m=l.match(/^(.*)\|\s*([TFtf]|সত্য|মিথ্যা)\s*$/);if(!m)throw new Error('শেষে | T বা F নেই: '+l);s.push(m[1].trim());k.push(/^[Tt]|সত্য/.test(m[2]))});
    return {t:L[0],s,k};
  });
}

act.calc=async b=>{

  for(const c of['apps','attempts','results'])await wipe(c,AD.id);
  const w=writeBatch(db);
  w.delete(doc(db,'exams',AD.id,'qs','main'));w.delete(doc(db,'exams',AD.id,'secret','key'));w.delete(doc(db,'exams',AD.id,'review','main'));w.delete(doc(db,'exams',AD.id));
  await w.commit();AD.id=null;await loadExam();toast('সব মুছে ফেলা হয়েছে');adminView();
};
act.pub=async()=>{
  const e=ex(),on=!e.resultsPublished,board=!!$('#c_b')?.checked,rev=!!$('#c_r')?.checked,w=writeBatch(db);
  (await getDocs(query(collection(db,'results'),where('examId','==',e.id)))).docs.forEach(d=>w.update(d.ref,{published:on,board:on&&board}));
  w.update(doc(db,'exams',e.id),{resultsPublished:on,board,review:rev});
  if(on&&rev){const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data().items,k=(await getDoc(doc(db,'exams',e.id,'secret','key'))).data().k;w.set(doc(db,'exams',e.id,'review','main'),{items:qs.map((q,i)=>({t:q.t,s:q.s,k:k[i]}))})}
  else w.delete(doc(db,'exams',e.id,'review','main'));
  await w.commit();await adminView();
};
act.tobank=async()=>{try{const it=parseQ(val('x_q'));for(let i=0;i<it.length;i+=400){const w=writeBatch(db);it.slice(i,i+400).forEach(q=>w.set(doc(db,'bank',String(hash(q.t))),{t:q.t,s:q.s,k:q.k.map(x=>x?1:0).join('')}));await w.commit()}toast(bn(it.length)+'টি ব্যাংকে জমা হয়েছে')}catch(e){$('#er').textContent=e.message}};
act.frombank=async()=>{
  const q=await getDocs(collection(db,'bank')),L=shuf(q.docs.map(d=>d.data()),Math.random).slice(0,+val('x_bn')||10);
  if(!L.length)return toast('ব্যাংক খালি');
  const t=L.map(x=>[x.t,...x.s.map((s,j)=>s+' | '+(x.k[j]==='1'?'T':'F'))].join('\n')).join('\n\n'),a=$('#x_q');
  a.value=(a.value.trim()?a.value.trim()+'\n\n':'')+t;toast(bn(L.length)+'টি যোগ হয়েছে');
};
async function tabAdm(){
  const q=await getDocs(collection(db,'admins'));
  $('#tabc').innerHTML=`<div class="card"><h2>সহকারী যোগ করুন</h2><small class="h">সহকারী শুধু ড্যাশবোর্ড দেখতে এবং আবেদন অনুমোদন/বাতিল করতে পারবেন। Authentication → Users থেকে তার UID দিন।</small><input id="a_u" placeholder="User UID"><button class="btn" data-a="addadm">সহকারী করুন</button></div>`+
  q.docs.map(d=>`<div class="card"><p style="word-break:break-all">${esc(d.id)} · <b>${d.data().role==='helper'?'সহকারী':'মালিক'}</b></p>${d.id!==S.user.uid?`<div class="row"><button class="n" data-a="rmadm" data-id="${esc(d.id)}">সরান</button></div>`:''}</div>`).join('');
}
act.addadm=async()=>{const u=val('a_u');if(!u)return;await setDoc(doc(db,'admins',u),{role:'helper'});toast('যোগ হয়েছে');tabAdm()};
act.rmadm=async b=>{if(confirm('সরাবেন?')){await deleteDoc(doc(db,'admins',b.dataset.id));tabAdm()}};
</script>
