<!DOCTYPE html>
<html lang="bn">
<head>

<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{--bg:#070b16;--bg2:#0d1426;--card:#111a30;--line:rgba(212,175,55,.25);--gold:#e6c65c;--gold2:#b8912a;--tx:#eef1f8;--mu:#9aa6c2;--ok:#7ee0a0;--bad:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;line-height:1.65;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top a{color:var(--gold);text-decoration:none}
h1{font-size:24px;margin:6px 0 12px;color:var(--gold)}
h2{font-size:19px;line-height:1.5;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card p{color:var(--mu);font-size:15px;margin:3px 0}
.card b{color:var(--tx)}
input,select,textarea{width:100%;padding:12px 14px;margin:4px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px;outline:none}
textarea{min-height:240px;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
input[readonly]{opacity:.75}
label{font-size:13.5px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{display:block;width:100%;border:0;padding:13px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;font-weight:700;font-size:16px;margin-top:6px;text-align:center;text-decoration:none}
.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:7px 16px;font-size:14px}
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);padding:10px 4px;border-radius:11px;font-weight:600}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700}
.y{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.n{background:rgba(255,138,138,.15);color:var(--bad);border:1px solid rgba(255,138,138,.3)!important}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);color:var(--gold)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;color:var(--gold);text-align:center;margin:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mu)}
.bar b{font-size:30px;color:var(--gold)}
.pg{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.pg i{display:block;height:100%;background:var(--gold);width:100%}
.st{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.st p{margin-bottom:10px;font-size:16px}
.tf{display:flex;gap:8px}
.tf button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-weight:600}
.tf button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;border-color:transparent}
.ex{user-select:none;-webkit-user-select:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#1a1300;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:9;max-width:90vw;text-align:center}
a.tel{color:var(--gold)}
small.h{display:block;color:var(--mu);font-size:12.5px;margin:-6px 0 10px}
.prof{display:flex;gap:14px;align-items:center}
.av{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:#1a1300;background:linear-gradient(135deg,var(--gold),var(--gold2))}
.un{font-size:18px;font-weight:700;color:var(--gold);word-break:break-all}
.kv{display:flex;gap:8px;font-size:14px;color:var(--mu);margin:2px 0}
.kv b{color:var(--tx);font-weight:500;word-break:break-word}
.uin{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg2);margin:4px 0 10px;padding-left:14px}
.uin span{color:var(--gold);font-weight:700}
.uin input{border:0;margin:0;background:none;padding-left:4px}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:6px;border-radius:99px;background:#ff5a5a;color:#fff;font-size:12px;line-height:20px;text-align:center}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,90,90,.12);border:1px solid rgba(255,90,90,.35);color:#ffb3b3;margin-bottom:14px;cursor:pointer}
.mt{color:var(--ok);font-size:13px}
.mm{color:var(--bad);font-size:13px}

/* ===== PREMIUM UNIVERSITY EXAM UI — visual layer only ===== */
:root{
 --bg:#f5f3ee;--bg2:#fffdfa;--card:#fffefa;--line:#e7e0d6;
 --gold:#8e2638;--gold2:#641a2a;--tx:#20252d;--mu:#777b83;
 --ok:#24734e;--bad:#b33b46;color-scheme:light;
 --shadow:0 18px 48px rgba(35,27,24,.07);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse at 12% 0%,rgba(142,38,56,.055),transparent 34rem),
  linear-gradient(180deg,#f8f6f1 0%,#f1eee8 100%);

}

h1{font-family:'Noto Serif Bengali','Hind Siliguri',serif;font-size:clamp(27px,4vw,36px);font-weight:700;letter-spacing:-.035em;line-height:1.35;color:#641a2a;margin:18px 0 22px}
h1:after{content:"";display:block;width:54px;height:3px;border-radius:3px;background:#a77a52;margin-top:13px}

.card,.st{
 background:rgba(255,254,250,.94);border:1px solid #e8e1d8;border-radius:20px;
 padding:clamp(18px,3vw,28px);margin-bottom:18px;
 box-shadow:var(--shadow);transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;
}
.card:hover{border-color:#d8c8bd;box-shadow:0 22px 55px rgba(35,27,24,.095)}
.card p{color:#686d75;font-size:15px;margin:5px 0}

label{display:block;color:#555b65;font-weight:700;font-size:13px;letter-spacing:.035em;margin:12px 0 5px}
input,select,textarea{
 width:100%;padding:13px 15px;margin:5px 0 12px;border-radius:12px;
 border:1px solid #ded8cf;background:#fff;color:#242830;font:inherit;font-size:15px;
 outline:none;box-shadow:0 1px 2px rgba(30,25,20,.025);transition:border-color .18s,box-shadow .18s,background .18s;
}
input:hover,select:hover,textarea:hover{border-color:#c9b7ac}
input:focus,select:focus,textarea:focus{border-color:#8e2638;box-shadow:0 0 0 4px rgba(142,38,56,.10);background:#fff}
input[readonly]{background:#f5f1ed;color:#6f6a68}
textarea{min-height:250px;line-height:1.8}
small.h{color:#85818a;font-size:12px}
.btn{
 display:flex;align-items:center;justify-content:center;gap:10px;width:100%;
 border:1px solid #641a2a;padding:14px 20px;border-radius:12px;
 background:linear-gradient(135deg,#762337,#501522);color:#fff;
 font-weight:700;font-size:15px;letter-spacing:.015em;margin-top:12px;
 text-align:center;text-decoration:none;box-shadow:0 8px 18px rgba(100,26,42,.17);
 transition:transform .18s,box-shadow .18s,filter .18s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(100,26,42,.22);filter:brightness(1.06)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.48;cursor:not-allowed;box-shadow:none;transform:none}
.ghost{background:#fff;border:1px solid #ddd2c9;color:#6c2636;border-radius:10px;padding:8px 15px;font-weight:700;transition:.18s}
.ghost:hover{background:#f7eff0;border-color:#c9aeb4}
.tabs{display:flex;gap:7px;background:#ebe6df;border:1px solid #e1d9d0;border-radius:14px;padding:5px;margin:0 0 18px}
.tabs button{flex:1;border:0;background:transparent;color:#77747a;padding:11px 8px;border-radius:10px;font-weight:700;transition:.18s}

.tabs button.on{background:#fffefa;color:#762337;box-shadow:0 2px 8px rgba(40,25,20,.09)}
.row{display:flex;gap:10px;margin-top:14px}
.row button{flex:1;border:0;border-radius:11px;padding:12px;font-weight:700;transition:transform .18s,filter .18s}
.row button:hover{transform:translateY(-1px);filter:brightness(1.04)}
.y{background:#e7f2eb;color:#226342;border:1px solid #c9e2d2!important}
.n{background:#faeded;color:#a33440;border:1px solid #efcdd0!important}
.tag{display:inline-flex;align-items:center;padding:4px 11px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid #dfc9cd;background:#f8eff1;color:#81283b}
.tag.ok{color:#24734e;background:#edf6f0;border-color:#d2e8d9}
.tag.bad{color:#ae3541;background:#fbefef;border-color:#efd1d3}
.big{font-family:'DM Sans',sans-serif;font-size:clamp(42px,8vw,58px);font-weight:800;color:#762337;text-align:center;margin:18px 0;letter-spacing:-.05em}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:#666c75;font-size:14px;font-weight:700}
.bar b{font-size:30px;color:#762337;font-variant-numeric:tabular-nums}
.pg{height:7px;border-radius:20px;background:#e8e2dc;overflow:hidden;margin-bottom:24px}
.pg i{display:block;height:100%;background:linear-gradient(90deg,#762337,#bd8b67);border-radius:20px;transition:width .2s}
.st{padding:18px 20px;border-radius:15px;margin-bottom:12px;box-shadow:0 5px 18px rgba(35,27,24,.045)}
.st p{margin-bottom:14px;color:#343941;font-size:16px;font-weight:600;line-height:1.65}
.tf{display:flex;gap:10px}
.tf button{flex:1;padding:12px;border-radius:10px;border:1px solid #ded8d0;background:#fff;color:#515660;font-weight:700;transition:.18s}
.tf button:hover{border-color:#b98d96;background:#fbf6f6}
.tf button.on{background:#762337;color:#fff;border-color:#762337;box-shadow:0 5px 12px rgba(118,35,55,.16)}
.ex{user-select:none;-webkit-user-select:none}
.err{color:#b33b46;font-size:13px;min-height:20px;margin-top:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#25232a;color:#fff;padding:12px 20px;border:1px solid rgba(255,255,255,.12);border-radius:12px;font-weight:600;box-shadow:0 12px 35px rgba(0,0,0,.18);z-index:20;max-width:90vw;text-align:center}
a.tel{color:#762337;font-weight:700;text-decoration:none}
.prof{display:flex;gap:16px;align-items:center}
.av{width:60px;height:60px;border-radius:17px;flex:none;display:grid;place-items:center;font-size:23px;font-weight:800;color:#fff;background:linear-gradient(145deg,#8d3348,#511827);box-shadow:0 8px 18px rgba(100,26,42,.16)}
.un{font-size:19px;font-weight:800;color:#762337;word-break:break-all}
.kv{display:flex;gap:8px;font-size:14px;color:#777b83;margin:4px 0}
.kv b{color:#30343b;font-weight:600;word-break:break-word}
.uin{display:flex;align-items:center;border:1px solid #ded8cf;border-radius:12px;background:#fff;margin:5px 0 12px;padding-left:15px}
.uin:focus-within{border-color:#8e2638;box-shadow:0 0 0 4px rgba(142,38,56,.09)}
.uin span{color:#762337;font-weight:800}
.uin input{border:0;margin:0;background:none;padding-left:7px;box-shadow:none}
.badge{display:inline-block;min-width:20px;padding:0 7px;margin-left:6px;border-radius:99px;background:#a83340;color:#fff;font-size:11px;line-height:20px;text-align:center}
.alert{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:13px;background:#fbefef;border:1px solid #efd1d3;color:#983342;margin-bottom:16px;cursor:pointer;font-weight:600}
.mt{color:#24734e;font-size:12px;font-weight:700}
.mm{color:#b33b46;font-size:12px;font-weight:700}
::selection{background:rgba(142,38,56,.18);color:#35131d}
@media(min-width:760px){
 #app{padding-top:42px}
 .card{padding:26px 30px}
}
@media(max-width:520px){
 #app{padding-left:14px;padding-right:14px}
 .card{border-radius:16px;padding:17px}
 .row{gap:8px}
 .row button{padding:11px 7px;font-size:14px}
 .tabs button{font-size:13px;padding:10px 4px}
 .st{padding:15px}
}
@media(prefers-reduced-motion:reduce){
 *,*::before,*::after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}

<body>
<main id="app"><div class="card"><p>লোড হচ্ছে…</p></div></main>
<div id="toast"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocFromServer,getDocs,setDoc,updateDoc,collection,query,orderBy,limit,where,serverTimestamp,Timestamp,increment,arrayUnion,writeBatch,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* index.html এর সাথে একই Firebase প্রজেক্ট — একই লগইন এখানেও চলবে */
const firebaseConfig = {
  apiKey:"AIzaSyBOcqP74z2N5bxTKes4xfQmsPW5eGk5R0s",
  authDomain:"cornea-help-center.firebaseapp.com",
  projectId:"cornea-help-center",
  storageBucket:"cornea-help-center.firebasestorage.app",
  messagingSenderId:"755555154486",
  appId:"1:755555154486:web:df02dec5573a7a9f203697"
};
const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const S={user:null,isAdmin:false,off:0,exam:null,tk:null,kyc:null,prof:null};
const AD={tab:'exam',exams:[],id:null,pend:0,unsub:null};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.off;
const fmt=ms=>new Date(ms).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'});
const loc=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const toast=(m,t=2600)=>{const x=$('#toast');x.textContent=m;x.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>x.style.display='none',t)};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const hash=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(arr,r)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const norm=d=>({...d.data(),id:d.id,s:d.data().startAt.toMillis(),en:d.data().endAt.toMillis()});
const kv=(a,b)=>`<div class="kv"><span>${a}:</span><b>${esc(b)||'—'}</b></div>`;
const topbar=()=>`<div class="top"><a href="index.html">← হোম</a><button class="ghost" data-a="logout">লগআউট</button></div>`;
const act={};
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b)});
const val=id=>($('#'+id)?.value||'').trim();
/* ---------- লগইন (মূল সাইটেই হয়) ---------- */
function loginView(){
  clearInterval(S.tk);stopWatch();
  app.innerHTML=`<div class="top"><a href="index.html">← হোম</a></div><h1>সাপ্তাহিক পরীক্ষা</h1><div class="card"><p>পরীক্ষায় ঢুকতে আগে মূল সাইটে লগইন করুন। একই একাউন্টে এখানে নিজে থেকেই ঢুকে যাবেন।</p><a class="btn" style="margin-top:14px" href="index.html">মূল সাইটে লগইন করুন</a></div>`;
}
act.logout=()=>signOut(auth).then(()=>{location.href='index.html'});
onAuthStateChanged(auth,async u=>{
  S.user=u;
  if(!u)return loginView();
  app.innerHTML=`<div class="card"><p>লোড হচ্ছে…</p></div>`;
  try{
    await setDoc(doc(db,'ping',u.uid),{t:serverTimestamp()});
    const p=await getDocFromServer(doc(db,'ping',u.uid));
    S.off=p.data().t.toMillis()-Date.now();
    S.isAdmin=(await getDoc(doc(db,'admins',u.uid))).exists();
    if(S.isAdmin){startWatch();await adminView();return}
    stopWatch();
    await studentGate();
  }catch(e){app.innerHTML=`<div class="card"><p>লোড করা যায়নি: ${esc(e.message)}</p></div>`}
});
async function loadExam(){
  const q=await getDocs(query(collection(db,'exams'),orderBy('startAt','desc'),limit(1)));
  S.exam=q.empty?null:norm(q.docs[0]);
}
/* ---------- শিক্ষার্থী: KYC যাচাই → প্রোফাইল → হোম ---------- */
async function studentGate(){
  const u=S.user;
  const sd=await getDoc(doc(db,'students',u.uid));
  S.kyc=sd.exists()?sd.data():null;
  const k=S.kyc;
  if(!k||k.status!=='approved'){
    const msg=!k?'আগে মূল সাইটে আইডি কার্ড যাচাই (KYC) সম্পন্ন করুন।':k.status==='pending'?'আপনার আইডি কার্ড যাচাই চলছে। অনুমোদন পেলে এখানে পরীক্ষার আবেদন করতে পারবেন।':'আপনার আইডি কার্ড যাচাই গৃহীত হয়নি। মূল সাইটে গিয়ে আবার তথ্য জমা দিন।';
    app.innerHTML=topbar()+`<h1>সাপ্তাহিক পরীক্ষা</h1><div class="card"><p>${msg}</p><a class="btn" style="margin-top:14px" href="index.html">মূল সাইটে যান</a></div>`;
    return;
  }
  const pd=await getDoc(doc(db,'profiles',u.uid));
  S.prof=pd.exists()?pd.data():null;
  S.prof?home():profileView();
}
function profileView(){
  const k=S.kyc;

  b.disabled=true;
  try{
    const ex=await getDoc(doc(db,'usernames',un));
    if(ex.exists()){b.disabled=false;$('#er').textContent='এই ইউজারনেম আগেই নেওয়া হয়েছে, অন্য একটা দিন।';return}

    w.set(doc(db,'usernames',un),{uid:S.user.uid});
    w.set(doc(db,'profiles',S.user.uid),{uid:S.user.uid,username:un,name:S.kyc.name||'',createdAt:serverTimestamp()});

    S.prof={uid:S.user.uid,username:un,name:S.kyc.name||''};

  }catch(e){b.disabled=false;$('#er').textContent=e.code==='permission-denied'?'এই ইউজারনেম নেওয়া যাবে না, অন্য একটা চেষ্টা করুন।':e.message}

act.start=async()=>{
  const e=S.exam,id=e.id+'_'+S.user.uid,ref=doc(db,'attempts',id);
  let a=await getDoc(ref);
  if(!a.exists()){
    await setDoc(ref,{uid:S.user.uid,examId:e.id,name:S.kyc?.name||'',username:S.prof?.username||'',startedAt:serverTimestamp(),qStart:serverTimestamp(),idx:0,ans:{},flags:0,done:false,failed:false});
    a=await getDocFromServer(ref);
  }
  const A=a.data();if(A.done||A.failed)return home();
  const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data().items,n=qs.length;
  const r=rng(hash(id)),order=shuf([...qs.keys()],r),sord=qs.map(()=>shuf([0,1,2,3,4],r));
  let idx=A.idx,qMs=A.qStart.toMillis(),cur=[],last=0,over=false;
  const per=e.secPerQ*1000;
  const flag=()=>{if(over||Date.now()-last<1500)return;last=Date.now();
    updateDoc(ref,{flags:increment(1),log:arrayUnion('প্রশ্ন'+(idx+1)+' @'+new Date(now()).toISOString().slice(11,19))}).catch(()=>{})};
  const vis=()=>{if(document.hidden)flag()};
  const stop=ev=>ev.preventDefault();
  document.addEventListener('visibilitychange',vis);window.addEventListener('blur',flag);
  ['contextmenu','copy','cut','paste'].forEach(t=>document.addEventListener(t,stop));
  const cleanup=()=>{over=true;clearInterval(S.tk);document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',flag);['contextmenu','copy','cut','paste'].forEach(t=>document.removeEventListener(t,stop))};
  const finish=async()=>{cleanup();try{await updateDoc(ref,{done:true,doneAt:serverTimestamp()})}catch(_){}home()};
  const next=async()=>{
    clearInterval(S.tk);idx++;
    if(idx>=n)return finish();
    updateDoc(ref,{idx,qStart:serverTimestamp()}).catch(()=>{});qMs=now();show();
  };
  function show(){
    const q=order[idx],it=qs[q],so=sord[q];
    cur=(A.ans[q]&&idx===A.idx?A.ans[q]:'-----').split('');
    app.innerHTML=`<div class="ex"><div class="bar"><span>প্রশ্ন ${bn(idx+1)} / ${bn(n)}</span><b id="tm"></b></div><div class="pg"><i id="pb"></i></div><h2>${esc(it.t)}</h2>`+
      so.map(si=>`<div class="st"><p>${esc(it.s[si])}</p><div class="tf" data-i="${si}"><button data-v="T" class="${cur[si]==='T'?'on':''}">সত্য</button><button data-v="F" class="${cur[si]==='F'?'on':''}">মিথ্যা</button></div></div>`).join('')+
      `<button class="btn" id="nx">${idx===n-1?'জমা দিন':'পরের প্রশ্ন'}</button></div>`;
    app.querySelectorAll('.tf button').forEach(bt=>bt.onclick=()=>{
      const i=+bt.parentNode.dataset.i,v=bt.dataset.v;cur[i]=cur[i]===v?'-':v;
      bt.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===cur[i]));
      updateDoc(ref,{['ans.'+q]:cur.join('')}).catch(()=>{});
    });
    $('#nx').onclick=next;
    clearInterval(S.tk);
    S.tk=setInterval(()=>{
      const left=Math.min(per-(now()-qMs),e.en-now());
      if(e.en-now()<=0)return finish();
      if(left<=0)return next();
      const tm=$('#tm'),pb=$('#pb');if(!tm)return;
      tm.textContent=bn(Math.ceil(left/1000))+' সে.';pb.style.width=Math.max(0,left/per*100)+'%';
    },250);
  }
  if(now()>=e.en||idx>=n)return finish();
  show();
};

  <label>ভুল স্টেটমেন্টে নম্বর কাটা (০ = কাটবে না)</label><input id="x_n" type="number" step="0.05" min="0" value="${e?.neg||0}">
  <label>প্রশ্ন (প্রতি প্রশ্নে ১ লাইন প্রশ্ন + ৫ লাইন "স্টেটমেন্ট | T বা F", প্রশ্নের মাঝে ফাঁকা লাইন)</label>
  <textarea id="x_q" placeholder="প্রশ্ন লিখুন&#10;প্রথম স্টেটমেন্ট | T&#10;দ্বিতীয় | F&#10;তৃতীয় | T&#10;চতুর্থ | F&#10;পঞ্চম | T">${esc(txt)}</textarea>
  <button class="btn" data-a="saveex">সংরক্ষণ করুন</button><div class="err" id="er"></div></div>`;

function parseQ(t){
  return t.trim().split(/\n\s*\n/).map(b=>{
    const L=b.trim().split('\n').map(x=>x.trim()).filter(Boolean);
    if(L.length!==6)throw new Error('প্রতি প্রশ্নে ১টি প্রশ্ন ও ৫টি স্টেটমেন্ট লাগবে: '+L[0]);
    const s=[],k=[];
    L.slice(1).forEach(l=>{const m=l.match(/^(.*)**\|**\s*([TFtf]|সত্য|মিথ্যা)\s*$/);if(!m)throw new Error('শেষে | T বা F নেই: '+l);s.push(m[1].trim());k.push(/^[Tt]|সত্য/.test(m[2]))});
    return {t:L[0],s,k};
  });
}
act.saveex=async b=>{
  try{
    const items=parseQ(val('x_q')),s=new Date(val('x_s')),en=new Date(val('x_e'));
    if(isNaN(s)||isNaN(en)||en<=s)throw new Error('সময় ঠিক করুন।');
    const ref=AD.id?doc(db,'exams',AD.id):doc(collection(db,'exams'));
    const data={title:val('x_t'),startAt:Timestamp.fromDate(s),endAt:Timestamp.fromDate(en),secPerQ:+val('x_p')||25,neg:+val('x_n')||0,qCount:items.length};
    if(!AD.id)data.resultsPublished=false;
    b.disabled=true;
    const w=writeBatch(db);
    w.set(ref,data,{merge:true});
    w.set(doc(db,'exams',ref.id,'qs','main'),{items:items.map(({t,s})=>({t,s}))});
    w.set(doc(db,'exams',ref.id,'secret','key'),{k:items.map(i=>i.k.map(x=>x?1:0).join(''))});
    await w.commit();AD.id=ref.id;toast('সংরক্ষিত হয়েছে');await adminView();
  }catch(e){b.disabled=false;$('#er').textContent=e.message}
};
async function tabApps(){
  if(!AD.id)return $('#tabc').innerHTML=`<div class="card"><p>আগে পরীক্ষা তৈরি করুন।</p></div>`;
  const q=await getDocs(query(collection(db,'apps'),where('examId','==',AD.id)));
  const L=q.docs.map(d=>({id:d.id,...d.data()}));
  const ord={pending:0,approved:1,rejected:2};
  L.sort((a,b)=>(ord[a.status]-ord[b.status])||((b.createdAt?.seconds||0)-(a.createdAt?.seconds||0)));
  const ks=await Promise.all(L.map(x=>getDoc(doc(db,'students',x.uid)).then(s=>s.exists()?s.data():null).catch(()=>null)));
  const nz=s=>String(s||'').toLowerCase().replace(/\s+/g,'');
  const ph=s=>String(s||'').replace(/\D/g,'').slice(-10);
  const row=(lab,v,kvv,isPh)=>{
    let m='';
    if(kvv!==undefined){const ok=isPh?(ph(v)&&ph(v)===ph(kvv)):(nz(v)&&nz(v)===nz(kvv));m=ok?' <span class="mt">✔ KYC-র সাথে মিলেছে</span>':` <span class="mm">✖ KYC: ${esc(kvv||'—')}</span>`}
    return `<p>${lab}: <b>${esc(v)||'—'}</b>${m}</p>`;
  };
  $('#tabc').innerHTML=`<p style="color:var(--mu);margin-bottom:10px">মোট ${bn(L.length)} জন, অনুমোদিত ${bn(L.filter(x=>x.status==='approved').length)} জন</p>`+
  (L.map((x,i)=>{const k=ks[i];return `<div class="card"><h2>${esc(x.name)} <span class="tag ${x.status==='approved'?'ok':x.status==='rejected'?'bad':''}">${x.status==='approved'?'অনুমোদিত':x.status==='rejected'?'বাতিল':'অপেক্ষমাণ'}</span></h2>
  <p>ইউজারনেম: <b>@${esc(x.username||'—')}</b></p>
  <p>ফোন: <a class="tel" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>${k?(ph(x.phone)&&ph(x.phone)===ph(k.mobile)?' <span class="mt">✔ KYC-র সাথে মিলেছে</span>':` <span class="mm">✖ KYC: ${esc(k.mobile||'—')}</span>`):''}</p>
  ${row('ডিপার্টমেন্ট',x.dept,k?(k.department||''):undefined)}
  ${row('সেশন',x.session,k?(k.session||''):undefined)}
  <p>ইমেইল: ${esc(x.email)}</p>
  ${k?`<p>KYC নাম: <b>${esc(k.name)}</b> · বাবা: <b>${esc(k.father)}</b></p>`:`<p class="mm">⚠ KYC তথ্য পাওয়া যায়নি</p>`}
  <div class="row"><button class="y" data-a="st" data-id="${esc(x.id)}" data-v="approved">অনুমোদন</button><button class="n" data-a="st" data-id="${esc(x.id)}" data-v="rejected">বাতিল</button></div></div>`}).join('')||`<div class="card"><p>কোনো আবেদন নেই।</p></div>`);
}
act.st=async b=>{b.disabled=true;await updateDoc(doc(db,'apps',b.dataset.id),{status:b.dataset.v});toast('হয়েছে');tabApps()};
async function tabRes(){
  const e=ex();if(!e)return $('#tabc').innerHTML=`<div class="card"><p>আগে পরীক্ষা তৈরি করুন।</p></div>`;
  const q=await getDocs(query(collection(db,'attempts'),where('examId','==',e.id)));
  const L=q.docs.map(d=>({id:d.id,...d.data()}));
  const rs=await getDocs(query(collection(db,'results'),where('examId','==',e.id)));
  const R={};rs.docs.forEach(d=>R[d.id]=d.data());
  $('#tabc').innerHTML=`<div class="card"><p>পরীক্ষা দিয়েছে: <b>${bn(L.length)}</b> জন · ফলাফল: <b>${e.resultsPublished?'প্রকাশিত':'অপ্রকাশিত'}</b></p>
  <button class="btn" data-a="calc">ফলাফল গণনা করুন</button>
  <button class="btn" data-a="pub" style="background:${e.resultsPublished?'var(--bad)':''}">${e.resultsPublished?'ফলাফল বন্ধ করুন':'ফলাফল প্রকাশ করুন'}</button></div>`+
  L.map(x=>`<div class="card"><h2>${esc(x.name)} ${x.username?`<span style="color:var(--gold);font-size:15px">@${esc(x.username)}</span>`:''} ${x.failed?'<span class="tag bad">ফেল</span>':x.done?'<span class="tag ok">জমা</span>':'<span class="tag">চলছে</span>'}</h2>
  <p>ট্যাব/অ্যাপ বদল: <b style="color:${x.flags?'var(--bad)':'inherit'}">${bn(x.flags||0)} বার</b></p>${(x.log||[]).length?`<p>${esc(x.log.join(', '))}</p>`:''}
  <p>প্রাপ্ত নম্বর: <b>${R[x.id]?bn(R[x.id].score):'—'}</b></p>
  <div class="row"><button class="n" data-a="fail" data-id="${esc(x.id)}" data-v="${x.failed?0:1}">${x.failed?'ফেল তুলে নিন':'ফেল করুন'}</button></div></div>`).join('');
}
act.fail=async b=>{await updateDoc(doc(db,'attempts',b.dataset.id),{failed:b.dataset.v==='1'});tabRes()};
act.calc=async b=>{
  b.disabled=true;
  try{
    const e=ex(),key=(await getDoc(doc(db,'exams',e.id,'secret','key'))).data().k;
    const q=await getDocs(query(collection(db,'attempts'),where('examId','==',e.id)));
    const w=writeBatch(db);
    q.docs.forEach(d=>{
      const A=d.data();let sc=0;
      key.forEach((kk,qi)=>{const a=A.ans?.[qi]||'-----';for(let i=0;i<5;i++){const c=a[i];if(c==='-')continue;((c==='T')===(kk[i]==='1'))?sc+=.2:sc-=(e.neg||0)}});
      if(A.failed)sc=0;sc=Math.max(0,Math.round(sc*100)/100);
      w.set(doc(db,'results',d.id),{uid:A.uid,examId:e.id,name:A.name||'',score:sc,failed:!!A.failed});
    });
    await w.commit();toast('গণনা সম্পন্ন');
  }catch(er){toast(er.message)}
  tabRes();
};
act.pub=async()=>{const e=ex();await updateDoc(doc(db,'exams',e.id),{resultsPublished:!e.resultsPublished});await adminView()};
</script>
