<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>সাপ্তাহিক পরীক্ষা</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b16;--bg2:#0d1426;--card:#111a30;--line:rgba(212,175,55,.25);--gold:#e6c65c;--gold2:#b8912a;--tx:#eef1f8;--mu:#9aa6c2;--ok:#7ee0a0;--bad:#ff8a8a;color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--tx);font-family:'Hind Siliguri',sans-serif;line-height:1.65;min-height:100vh}
#app{max-width:720px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 40px)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.top a{color:var(--gold);text-decoration:none}
h1{font-size:24px;margin:6px 0 12px;color:var(--gold)}
h2{font-size:19px;line-height:1.5;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:14px}
.card p{color:var(--mu);font-size:15px;margin:3px 0}
.card b{color:var(--tx)}
input,select,textarea{width:100%;padding:12px 14px;margin:4px 0 10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:16px;outline:none}
textarea{min-height:240px;font-size:14px}
input:focus,select:focus,textarea:focus{border-color:var(--gold)}
label{font-size:13.5px;color:var(--mu)}
button{font:inherit;cursor:pointer}
.btn{width:100%;border:0;padding:13px;border-radius:99px;background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;font-weight:700;font-size:16px;margin-top:6px}
.btn:disabled{opacity:.5}
.ghost{background:none;border:1px solid var(--line);color:var(--gold);border-radius:99px;padding:7px 16px;font-size:14px}
.gb{width:100%;padding:13px;border-radius:99px;border:0;background:#fff;color:#222;font-weight:600;font-size:16px;margin-bottom:12px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;background:rgba(255,255,255,.05);border-radius:14px;padding:4px;margin-bottom:14px}
.tabs button{flex:1 1 auto;border:0;background:none;color:var(--mu);padding:10px 8px;border-radius:11px;font-weight:600;font-size:14px}
.tabs button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.row{display:flex;gap:8px;margin-top:10px}
.row button{flex:1;border:0;border-radius:12px;padding:10px;font-weight:700}
.y{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300}
.n{background:rgba(255,138,138,.15);color:var(--bad);border:1px solid rgba(255,138,138,.3)!important}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;border:1px solid var(--line);color:var(--gold)}
.tag.ok{color:var(--ok)}.tag.bad{color:var(--bad)}
.big{font-size:44px;font-weight:700;color:var(--gold);text-align:center;margin:10px 0}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;color:var(--mu)}
.bar b{font-size:30px;color:var(--gold)}
.pg{height:6px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:18px}
.pg i{display:block;height:100%;background:var(--gold);width:100%}
.st{padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
.st p{margin-bottom:10px;font-size:16px}
.tf{display:flex;gap:8px}
.tf button{flex:1;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);font-weight:600}
.tf button.on{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#1a1300;border-color:transparent}
.ex{user-select:none;-webkit-user-select:none}
.err{color:var(--bad);font-size:14px;min-height:20px;margin-top:6px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--gold);color:#1a1300;padding:10px 20px;border-radius:99px;font-weight:600;display:none;z-index:99}
a.tel{color:var(--gold)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 6px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{font-size:12.5px;color:var(--mu)}
small.h{display:block;color:var(--mu);font-size:12.5px;margin:-6px 0 10px}
#kprev{display:none;width:100%;border-radius:12px;border:1px solid var(--line);margin:4px 0 10px}
.idp{display:block;width:100%;border-radius:12px;border:1px solid var(--line);margin:10px 0;cursor:zoom-in;background:#000}
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.96);display:none;overflow:auto}
#lb.on{display:block}
#lb img{display:block;margin:64px auto 24px;max-width:100%;cursor:zoom-in}
#lb.z img{max-width:none;width:220%;margin:64px 0 24px;cursor:zoom-out}
#lbx{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:51;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);color:var(--gold);font-size:26px;line-height:1}
</style>
</head>
<body>
<main id="app"></main>
<div id="toast"></div>
<div id="lb"><button id="lbx" aria-label="বন্ধ">×</button><img id="lbi" alt="ID card"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,GoogleAuthProvider,signInWithPopup,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,getDocFromServer,getDocs,setDoc,updateDoc,collection,query,orderBy,limit,where,serverTimestamp,Timestamp,increment,arrayUnion,writeBatch,deleteDoc} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== Firebase config (index.html এর সাথে একই) ====== */
const firebaseConfig = {
  apiKey:"AIzaSyBOcqP74z2N5bxTKes4xfQmsPW5eGk5R0s",
  authDomain:"cornea-help-center.firebaseapp.com",
  projectId:"cornea-help-center",
  storageBucket:"cornea-help-center.firebasestorage.app",
  messagingSenderId:"755555154486",
  appId:"1:755555154486:web:df02dec5573a7a9f203697"
};
const ADMIN_EMAIL="tanvirahmedsifat8@gmail.com";
/* index.html এর ডিপার্টমেন্ট তালিকার সাথে মিল রাখা */
const DEPTS=["Medical Technology (Laboratory)","Medical Technology (Radiology & Imaging)","Medical Technology (Radiotherapy)","Physiotherapy","Dental Technology","Pharmacy"];
/* ================================================================ */

const fb=initializeApp(firebaseConfig), auth=getAuth(fb), db=getFirestore(fb);
const S={user:null,isAdmin:false,role:'',off:0,exam:null,mode:'',tk:null,prof:null,me:null};
const AD={tab:'dash',exams:[],id:null,kf:'pending',kl:[]};
const $=s=>document.querySelector(s), app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now=()=>Date.now()+S.off;
const fmt=ms=>new Date(ms).toLocaleString('bn-BD',{dateStyle:'medium',timeStyle:'short'});
const loc=ms=>new Date(ms-new Date(ms).getTimezoneOffset()*6e4).toISOString().slice(0,16);
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',2600)};
const bn=n=>String(n).replace(/\d/g,d=>'০১২৩৪৫৬৭৮৯'[d]);
const normPhone=s=>String(s||'').replace(/[০-৯]/g,d=>'০১২৩৪৫৬৭৮৯'.indexOf(d)).replace(/[\s-]/g,'');
const hash=s=>{let h=1779033703^s.length;for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19}return h>>>0};
const rng=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const shuf=(arr,r)=>{for(let i=arr.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]]}return arr};
const norm=d=>({...d.data(),id:d.id,s:d.data().startAt.toMillis(),en:d.data().endAt.toMillis()});
const act={};
app.addEventListener('click',ev=>{const b=ev.target.closest('[data-a]');if(b&&act[b.dataset.a])act[b.dataset.a](b)});
app.addEventListener('change',ev=>{if(ev.target.id==='k_photo')previewPhoto(ev.target)});
app.addEventListener('input',ev=>{if(ev.target.id==='kq')renderKyc()});
const val=id=>($('#'+id)?.value||'').trim();

/* ---------- ছবি জুম (লাইটবক্স) ---------- */
$('#lbx').onclick=()=>{$('#lb').className=''};
$('#lbi').onclick=()=>$('#lb').classList.toggle('z');
act.zoom=b=>{$('#lbi').src=b.src;$('#lb').className='on'};

/* ---------- লগইন ---------- */
function loginView(){
  clearInterval(S.tk);
  app.innerHTML=`<h1>সাপ্তাহিক পরীক্ষা</h1><div class="card"><p style="margin-bottom:10px">মূল সাইটে যে ইমেইল/Google দিয়ে সাইন আপ করেছেন, সেটা দিয়েই লগইন করুন।</p><button class="gb" data-a="google">Google দিয়ে লগইন</button>
  <label>ইমেইল</label><input id="em" type="email" autocomplete="email"><label>পাসওয়ার্ড</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" data-a="emlogin">ইমেইলে লগইন</button><button class="ghost" style="margin-top:10px;width:100%" data-a="emreg">নতুন অ্যাকাউন্ট খুলুন</button><div class="err" id="er"></div></div>`;
}
const fail=e=>{const x=$('#er');if(x)x.textContent=e.message;else toast(e.message)};
act.google=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(fail);
act.emlogin=()=>signInWithEmailAndPassword(auth,val('em'),val('pw')).catch(fail);
act.emreg=()=>createUserWithEmailAndPassword(auth,val('em'),val('pw')).catch(fail);
act.logout=()=>signOut(auth);

function gateView(msg){
  app.innerHTML=`<div class="top"><a href="index.html">← হোম</a><button class="ghost" data-a="logout">লগআউট</button></div><h1>সাপ্তাহিক পরীক্ষা</h1><div class="card"><p>${msg}</p><p style="margin-top:10px"><a class="tel" href="index.html">মূল সাইটে যান</a></p></div>`;
}

onAuthStateChanged(auth,async u=>{
  S.user=u;if(!u)return loginView();
  try{
    await setDoc(doc(db,'ping',u.uid),{t:serverTimestamp()});
    const p=await getDocFromServer(doc(db,'ping',u.uid));
    S.off=p.data().t.toMillis()-Date.now();
    const own=(u.email||'').toLowerCase()===ADMIN_EMAIL.toLowerCase();
    const ad=await getDoc(doc(db,'admins',u.uid));
    S.isAdmin=own||ad.exists();
    S.role=own?'owner':(ad.exists()?(ad.data().role||'helper'):'');
    /* সাধারণ ব্যবহারকারী: মূল সাইটে প্রোফাইল থাকতে হবে, ব্লক হলে ঢোকা বন্ধ */
    S.prof=null;
    if(!own){const pd=await getDoc(doc(db,'profiles',u.uid));S.prof=pd.exists()?pd.data():null}
    if(!S.isAdmin){
      if(!S.prof)return gateView('পরীক্ষায় অংশ নিতে আগে মূল সাইটে গিয়ে আপনার প্রোফাইল তৈরি করুন।');
      if(S.prof.status==='blocked')return gateView('আপনার অ্যাকাউন্ট ব্লক করা হয়েছে। অ্যাডমিনের সাথে যোগাযোগ করুন।');
    }
    await loadExam();
    await ((S.isAdmin&&S.mode!=='student')?adminView():home());
  }catch(e){app.innerHTML=`<div class="card"><p>লোড করা যায়নি: ${esc(e.message)}</p></div>`}
});
async function loadExam(){
  const q=await getDocs(query(collection(db,'exams'),orderBy('startAt','desc'),limit(1)));
  S.exam=q.empty?null:norm(q.docs[0]);
}

/* ---------- KYC (একবারই, অনুমোদন পেলে আর লাগবে না) ---------- */
function kycForm(K){
  const p=S.prof||{},u=S.user,v=K||{};
  return `<div class="card"><h2>KYC যাচাই</h2><p style="margin-bottom:10px">পরীক্ষায় অংশ নিতে একবার পরিচয় যাচাই করতে হবে। অনুমোদন পেলে পরের পরীক্ষাগুলোতে আর দিতে হবে না।</p>
  <label>পূর্ণ নাম</label><input id="k_name" value="${esc(v.name||p.name||u.displayName||'')}">
  <label>ডিপার্টমেন্ট</label><select id="k_dept"><option value="">বাছাই করুন</option>${DEPTS.map(d=>`<option ${d===(v.department||p.department)?'selected':''}>${esc(d)}</option>`).join('')}</select>
  <label>মোবাইল নম্বর</label><input id="k_phone" type="tel" inputmode="tel" value="${esc(v.phone||p.mobile||'')}">
  <label>আইডি কার্ডের ছবি (পরিষ্কার ও পুরো কার্ড দেখা যায় এমন)</label><input id="k_photo" type="file" accept="image/*"><img id="kprev" alt="">
  <button class="btn" data-a="kycsub">KYC জমা দিন</button><div class="err" id="er"></div></div>`;
}
function previewPhoto(inp){
  const f=inp.files[0],im=$('#kprev');if(!f||!im)return;
  im.src=URL.createObjectURL(f);im.style.display='block';
}
const kycImg=file=>new Promise((res,rej)=>{
  const r=new FileReader();
  r.onerror=()=>rej(new Error('ছবি পড়া যায়নি'));
  r.onload=()=>{
    const im=new Image();
    im.onerror=()=>rej(new Error('ছবিটি খোলা যাচ্ছে না, অন্য ছবি দিন'));
    im.onload=()=>{
      let M=1200,q,o;
      for(;;){
        const sc=Math.min(1,M/Math.max(im.width,im.height)),c=document.createElement('canvas');
        c.width=Math.max(1,Math.round(im.width*sc));c.height=Math.max(1,Math.round(im.height*sc));
        c.getContext('2d').drawImage(im,0,0,c.width,c.height);
        q=.8;o=c.toDataURL('image/jpeg',q);
        while(o.length>600000&&q>.4){q-=.1;o=c.toDataURL('image/jpeg',q)}
        if(o.length<=600000||M<500)break;
        M-=250;
      }
      o.length<=600000?res(o):rej(new Error('ছবির সাইজ অনেক বড়, অন্য ছবি দিন'));
    };
    im.src=r.result;
  };
  r.readAsDataURL(file);
});
act.kycsub=async b=>{
  const u=S.user,name=val('k_name'),dept=val('k_dept'),phone=normPhone(val('k_phone')),f=$('#k_photo')?.files[0],er=$('#er');
  if(name.length<2)return er.textContent='পূর্ণ নাম লিখুন।';
  if(!dept)return er.textContent='ডিপার্টমেন্ট বাছাই করুন।';
  if(!/^\+?\d{10,15}$/.test(phone))return er.textContent='সঠিক মোবাইল নম্বর দিন।';
  if(!f)return er.textContent='আইডি কার্ডের ছবি দিন।';
  b.disabled=true;er.textContent='ছবি প্রস্তুত হচ্ছে…';
  try{
    const photo=await kycImg(f),w=writeBatch(db);
    w.set(doc(db,'kyc',u.uid),{uid:u.uid,name:name.slice(0,90),department:dept,phone,email:u.email||'',hasPhoto:true,status:'pending',createdAt:serverTimestamp()});
    w.set(doc(db,'kycphoto',u.uid),{photo});
    await w.commit();toast('KYC জমা হয়েছে');home();
  }catch(e){b.disabled=false;er.textContent=e.message}
};

/* ---------- শিক্ষার্থী হোম ---------- */
async function home(){
  clearInterval(S.tk);
  const u=S.user,e=S.exam;
  let h=`<div class="top"><a href="index.html">← হোম</a><span>${S.isAdmin?'<button class="ghost" data-a="toadm">অ্যাডমিন</button> ':''}<button class="ghost" data-a="logout">লগআউট</button></span></div><h1>সাপ্তাহিক পরীক্ষা</h1>`;
  const [kd,sd]=await Promise.all([getDoc(doc(db,'kyc',u.uid)),getDoc(doc(db,'students',u.uid)).catch(()=>null)]);
  const K=kd.exists()?kd.data():null;
  const old=(sd&&sd.exists()&&sd.data().status==='approved')?sd.data():null; /* পুরনো সিস্টেমে অনুমোদিতরা */
  const kycOk=(K&&K.status==='approved')||!!old;
  if(!kycOk){
    if(K&&K.status==='pending'){
      h+=`<div class="card"><span class="tag">KYC যাচাই চলছে</span><p style="margin-top:8px">আপনার তথ্য জমা হয়েছে। অ্যাডমিন অনুমোদন দিলে পরীক্ষার আবেদন করতে পারবেন।</p></div>`;
    }else{
      if(K&&K.status==='rejected')h+=`<div class="card"><span class="tag bad">KYC গৃহীত হয়নি</span>${K.reason?`<p style="margin-top:8px">কারণ: ${esc(K.reason)}</p>`:''}<p>সঠিক তথ্য ও পরিষ্কার ছবি দিয়ে আবার জমা দিন।</p></div>`;
      h+=kycForm(K);
    }
    app.innerHTML=h;return;
  }
  S.me=(K&&K.status==='approved')?{name:K.name,phone:K.phone,dept:K.department}:{name:old.name||'',phone:old.mobile||'',dept:old.department||''};
  if(!e){app.innerHTML=h+`<div class="card"><p>এখনো কোনো পরীক্ষা ঘোষণা হয়নি।</p></div>`;return}
  const aid=e.id+'_'+u.uid;
  const [ap,at]=await Promise.all([getDoc(doc(db,'apps',aid)),getDoc(doc(db,'attempts',aid))]);
  h+=`<div class="card"><h2>${esc(e.title)}</h2><p>শুরু: <b>${fmt(e.s)}</b></p><p>শেষ: <b>${fmt(e.en)}</b></p><p>প্রশ্ন: <b>${bn(e.qCount||0)}টি</b> · প্রতি প্রশ্ন সর্বোচ্চ <b>${bn(e.secPerQ)} সেকেন্ড</b></p></div>`;
  if(!ap.exists()){
    h+= now()<e.en ? `<div class="card"><h2>পরীক্ষার আবেদন</h2><span class="tag ok">KYC সম্পন্ন</span>
    <p style="margin-top:8px">নাম: <b>${esc(S.me.name)}</b></p><p>ডিপার্টমেন্ট: <b>${esc(S.me.dept||'—')}</b></p><p>মোবাইল: <b>${esc(S.me.phone)}</b></p>
    <button class="btn" data-a="apply">আবেদন করুন</button><div class="err" id="er"></div></div>`
    : `<div class="card"><p>এই পরীক্ষার আবেদনের সময় শেষ।</p></div>`;
  }else{
    const st=ap.data().status;

act.go=async()=>{
  if(!$('#ag')?.checked)return toast('নিয়মে সম্মতি দিন');
  try{await document.documentElement.requestFullscreen()}catch(_){}
  const e=S.exam,id=e.id+'_'+S.user.uid,ref=doc(db,'attempts',id);
  let a=await getDoc(ref);
  if(!a.exists()){
    await setDoc(ref,{uid:S.user.uid,examId:e.id,name:S.me?.name||S.prof?.name||S.user.displayName||'',startedAt:serverTimestamp(),qStart:serverTimestamp(),idx:0,ans:{},flags:0,done:false,failed:false});
    a=await getDocFromServer(ref);
  }
  const A=a.data();if(A.done||A.failed)return home();
  const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data().items,n=qs.length;
  const r=rng(hash(id)),order=shuf([...qs.keys()],r),sord=qs.map(()=>shuf([0,1,2,3,4],r));
  let idx=A.idx,qMs=A.qStart.toMillis(),cur=[],last=0,over=false;
  const per=e.secPerQ*1000;
  const flag=()=>{if(over||Date.now()-last<1500)return;last=Date.now();
    updateDoc(ref,{flags:increment(1),log:arrayUnion('প্রশ্ন'+(idx+1)+' @'+new Date(now()).toISOString().slice(11,19))}).catch(()=>{})};
  const vis=()=>{if(document.hidden||(document.fullscreenEnabled&&!document.fullscreenElement))flag()};
  const stop=ev=>ev.preventDefault();
  document.addEventListener('visibilitychange',vis);document.addEventListener('fullscreenchange',vis);window.addEventListener('blur',flag);
  ['contextmenu','copy','cut','paste'].forEach(t=>document.addEventListener(t,stop));
  const cleanup=()=>{over=true;try{document.fullscreenElement&&document.exitFullscreen()}catch(_){}document.removeEventListener('fullscreenchange',vis);clearInterval(S.tk);document.removeEventListener('visibilitychange',vis);window.removeEventListener('blur',flag);['contextmenu','copy','cut','paste'].forEach(t=>document.removeEventListener(t,stop))};
  const finish=async()=>{cleanup();try{await updateDoc(ref,{done:true,doneAt:serverTimestamp()})}catch(_){}home()};
  const next=async()=>{
    clearInterval(S.tk);idx++;
    if(idx>=n)return finish();
    updateDoc(ref,{idx,qStart:serverTimestamp()}).catch(()=>{});qMs=now();show();
  };
  function show(){
    const q=order[idx],it=qs[q],so=sord[q];
    cur=(A.ans[q]&&idx===A.idx?A.ans[q]:'-----').split('');
    app.innerHTML=`<div class="ex"><div class="bar"><span>প্রশ্ন ${bn(idx+1)} / ${bn(n)}</span><b id="tm"></b></div><div class="pg"><i id="pb"></i></div><h2>${esc(it.t)}</h2>`+
      so.map(si=>`<div class="st"><p>${esc(it.s[si])}</p><div class="tf" data-i="${si}"><button data-v="T" class="${cur[si]==='T'?'on':''}">সত্য</button><button data-v="F" class="${cur[si]==='F'?'on':''}">মিথ্যা</button></div></div>`).join('')+
      `<button class="btn" id="nx">${idx===n-1?'জমা দিন':'পরের প্রশ্ন'}</button></div>`;
    app.querySelectorAll('.tf button').forEach(bt=>bt.onclick=()=>{
      const i=+bt.parentNode.dataset.i,v=bt.dataset.v;cur[i]=cur[i]===v?'-':v;
      bt.parentNode.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x.dataset.v===cur[i]));
      updateDoc(ref,{['ans.'+q]:cur.join('')}).catch(()=>{});
    });
    $('#nx').onclick=next;
    clearInterval(S.tk);
    S.tk=setInterval(()=>{
      const left=Math.min(per-(now()-qMs),e.en-now());
      if(e.en-now()<=0)return finish();
      if(left<=0)return next();
      $('#tm').textContent=bn(Math.ceil(left/1000))+' সে.';$('#pb').style.width=Math.max(0,left/per*100)+'%';
    },250);
  }
  if(now()>=e.en||idx>=n)return finish();
  show();
};

    c(ap.length,'মোট আবেদন')+c(ap.filter(x=>x.status==='pending').length,'অপেক্ষমাণ')+c(ap.filter(x=>x.status==='approved').length,'অনুমোদিত')+
    c(at.length,'পরীক্ষা দিয়েছে')+c(at.filter(x=>(x.flags||0)>=3).length,'সন্দেহজনক')+c(avg,'গড় নম্বর')+
    `</div><div class="card"><button class="btn" data-a="apprall">সব অপেক্ষমাণ একসাথে অনুমোদন</button>${S.role==='owner'?'<button class="btn" data-a="csv">ফলাফল Excel (CSV) ডাউনলোড</button>':''}</div>`;
}
act.apprall=async()=>{
  const q=await getDocs(query(collection(db,'apps'),where('examId','==',AD.id),where('status','==','pending')));
  if(q.empty)return toast('অপেক্ষমাণ কেউ নেই');
  if(!confirm(bn(q.size)+' জনকে অনুমোদন দেবেন?'))return;
  const w=writeBatch(db);q.docs.forEach(d=>w.update(d.ref,{status:'approved'}));await w.commit();toast('অনুমোদিত');tabDash();
};
act.csv=async()=>{
  const g=async c=>{const m={};(await getDocs(query(collection(db,c),where('examId','==',AD.id)))).docs.forEach(d=>m[d.id]=d.data());return m};
  const [R,T,P]=await Promise.all([g('results'),g('attempts'),g('apps')]);
  const rows=Object.keys(R).map(k=>[P[k]?.name||R[k].name,P[k]?.phone||'',P[k]?.inst||'',P[k]?.batch||'',R[k].score,R[k].failed?'হ্যাঁ':'না',T[k]?.flags||0]).sort((a,b)=>b[4]-a[4]);
  rows.unshift(['নাম','ফোন','ডিপার্টমেন্ট','ব্যাচ','নম্বর','ফেল','ট্যাব বদল']);
  const csv='\ufeff'+rows.map(r=>r.map(c=>{c=String(c??'');if(/^[=+\-@]/.test(c))c="'"+c;return '"'+c.replace(/"/g,'""')+'"'}).join(',')).join('\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='result.csv';a.click();
};
async function tabExam(){
  const e=ex();let txt='';
  if(e){
    const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data()?.items||[];
    const k=(await getDoc(doc(db,'exams',e.id,'secret','key'))).data()?.k||[];
    txt=qs.map((it,i)=>[it.t,...it.s.map((s,j)=>s+' | '+(k[i]?.[j]==='1'?'T':'F'))].join('\n')).join('\n\n');
  }
  const st=e?.s||Math.ceil(Date.now()/9e5)*9e5, en=e?.en||st+750000;
  $('#tabc').innerHTML=`<div class="card">
  <label>শিরোনাম</label><input id="x_t" value="${esc(e?.title||'সাপ্তাহিক পরীক্ষা')}">
  <label>শুরুর সময়</label><input id="x_s" type="datetime-local" value="${loc(st)}">
  <label>শেষের সময় (সবার জন্য একই)</label><input id="x_e" type="datetime-local" value="${loc(en)}">
  <small class="h">৩০ প্রশ্ন × ২৫ সেকেন্ড = ১২.৫ মিনিট, সেই হিসাবে শেষের সময় দিন।</small>
  <label>প্রতি প্রশ্নের সময় (সেকেন্ড)</label><input id="x_p" type="number" min="5" value="${e?.secPerQ||25}">
  <label>ভুল স্টেটমেন্টে নম্বর কাটা (০ = কাটবে না)</label><input id="x_n" type="number" step="0.05" min="0" value="${e?.neg||0}">
  <label>প্রশ্ন (প্রতি প্রশ্নে ১ লাইন প্রশ্ন + ৫ লাইন "স্টেটমেন্ট | T বা F", প্রশ্নের মাঝে ফাঁকা লাইন)</label>
  <textarea id="x_q" placeholder="প্রশ্ন লিখুন
প্রথম স্টেটমেন্ট | T
দ্বিতীয় | F
তৃতীয় | T
চতুর্থ | F
পঞ্চম | T">${esc(txt)}</textarea>
  <div class="row"><button class="ghost" data-a="tobank">ব্যাংকে জমা</button><input id="x_bn" type="number" min="1" placeholder="কতটি" style="margin:0"><button class="ghost" data-a="frombank">ব্যাংক থেকে আনুন</button></div><button class="btn" data-a="saveex">সংরক্ষণ করুন</button><div class="err" id="er"></div></div>`;
}
function parseQ(t){
  return t.trim().split(/\n\s*\n/).map(b=>{
    const L=b.trim().split('\n').map(x=>x.trim()).filter(Boolean);
    if(L.length!==6)throw new Error('প্রতি প্রশ্নে ১টি প্রশ্ন ও ৫টি স্টেটমেন্ট লাগবে: '+L[0]);
    const s=[],k=[];
    L.slice(1).forEach(l=>{const m=l.match(/^(.*)\|\s*([TFtf]|সত্য|মিথ্যা)\s*$/);if(!m)throw new Error('শেষে | T বা F নেই: '+l);s.push(m[1].trim());k.push(/^[Tt]|সত্য/.test(m[2]))});
    return {t:L[0],s,k};
  });
}
act.saveex=async b=>{
  try{
    const items=parseQ(val('x_q')),s=new Date(val('x_s')),en=new Date(val('x_e'));
    if(isNaN(s)||isNaN(en)||en<=s)throw new Error('সময় ঠিক করুন।');
    const ref=AD.id?doc(db,'exams',AD.id):doc(collection(db,'exams'));
    const data={title:val('x_t'),startAt:Timestamp.fromDate(s),endAt:Timestamp.fromDate(en),secPerQ:Math.round(+val('x_p'))||25,neg:+val('x_n')||0,qCount:items.length};
    if(!AD.id)data.resultsPublished=false;
    b.disabled=true;
    const w=writeBatch(db);
    w.set(ref,data,{merge:true});
    w.set(doc(db,'exams',ref.id,'qs','main'),{items:items.map(({t,s})=>({t,s}))});
    w.set(doc(db,'exams',ref.id,'secret','key'),{k:items.map(i=>i.k.map(x=>x?1:0).join(''))});
    await w.commit();AD.id=ref.id;toast('সংরক্ষিত হয়েছে');await adminView();
  }catch(e){b.disabled=false;$('#er').textContent=e.message}
};

async function tabApps(){
  if(!AD.id)return $('#tabc').innerHTML=`<div class="card"><p>আগে পরীক্ষা তৈরি করুন।</p></div>`;
  const q=await getDocs(query(collection(db,'apps'),where('examId','==',AD.id)));
  const L=q.docs.map(d=>({id:d.id,...d.data()}));
  const ord={pending:0,approved:1,rejected:2};L.sort((a,b)=>ord[a.status]-ord[b.status]);
  $('#tabc').innerHTML=`<p style="color:var(--mu);margin-bottom:10px">মোট ${bn(L.length)} জন, অনুমোদিত ${bn(L.filter(x=>x.status==='approved').length)} জন</p>`+
  (L.map(x=>x.status==='rejected'?`<div class="card"><p>বাতিল, ব্যক্তিগত তথ্য মুছে ফেলা হয়েছে</p></div>`:`<div class="card"><h2>${esc(x.name)} <span class="tag ${x.status==='approved'?'ok':''}">${x.status==='approved'?'অনুমোদিত':'অপেক্ষমাণ'}</span></h2>
  <p>ফোন: <a class="tel" href="tel:${esc(x.phone)}">${esc(x.phone)}</a></p><p>ইমেইল: ${esc(x.email)}</p><p>ডিপার্টমেন্ট: ${esc(x.inst)}</p><p>ব্যাচ: ${esc(x.batch)}</p>
  <div class="row">${x.status==='approved'?`<button class="ghost" style="border-radius:12px" data-a="st" data-id="${x.id}" data-v="pending">অনুমোদন তুলে নিন</button>`:`<button class="y" data-a="st" data-id="${x.id}" data-v="approved">অনুমোদন</button>`}<button class="n" data-a="st" data-id="${x.id}" data-v="rejected">বাতিল (তথ্য মুছবে)</button></div></div>`).join('')||`<div class="card"><p>কোনো আবেদন নেই।</p></div>`);
}
act.st=async b=>{
  const id=b.dataset.id,ref=doc(db,'apps',id);
  if(b.dataset.v==='rejected'){
    if(!confirm('বাতিল করলে এই আবেদনকারীর নাম, ফোন, ইমেইল, পরীক্ষার উত্তর ও ফলাফল সব মুছে যাবে। নিশ্চিত?'))return;
    await setDoc(ref,{uid:id.slice(AD.id.length+1),examId:AD.id,status:'rejected'});
    try{await deleteDoc(doc(db,'attempts',id));await deleteDoc(doc(db,'results',id))}catch(_){}
  }else await updateDoc(ref,{status:b.dataset.v});
  toast('হয়েছে');tabApps();
};

async function tabRes(){
  const e=ex();if(!e)return $('#tabc').innerHTML=`<div class="card"><p>আগে পরীক্ষা তৈরি করুন।</p></div>`;
  const q=await getDocs(query(collection(db,'attempts'),where('examId','==',e.id)));
  const L=q.docs.map(d=>({id:d.id,...d.data()}));
  const rs=await getDocs(query(collection(db,'results'),where('examId','==',e.id)));
  const R={};rs.docs.forEach(d=>R[d.id]=d.data());
  $('#tabc').innerHTML=`<div class="card"><p>পরীক্ষা দিয়েছে: <b>${bn(L.length)}</b> জন · ফলাফল: <b>${e.resultsPublished?'প্রকাশিত':'অপ্রকাশিত'}</b></p>
  <button class="btn" data-a="calc">ফলাফল গণনা করুন</button>
  <label style="display:flex;gap:8px;align-items:center;margin-top:10px;color:var(--tx)"><input type="checkbox" id="c_b" style="width:auto;margin:0" ${e.board?'checked':''}>মেধাতালিকা দেখাবে</label><label style="display:flex;gap:8px;align-items:center;margin:6px 0;color:var(--tx)"><input type="checkbox" id="c_r" style="width:auto;margin:0" ${e.review?'checked':''}>উত্তর রিভিউ দেখাবে</label><button class="btn" data-a="pub" style="background:${e.resultsPublished?'var(--bad)':''}">${e.resultsPublished?'ফলাফল বন্ধ করুন':'ফলাফল প্রকাশ করুন'}</button>
  <div class="row"><button class="n" data-a="wipe">আবেদন ও উত্তর মুছুন (ফলাফল থাকবে)</button></div><div class="row"><button class="n" data-a="wipeall">পরীক্ষাসহ সব মুছুন</button></div></div>`+
  L.map(x=>`<div class="card"><h2>${esc(x.name)} ${(x.flags||0)>=3?'<span class="tag bad">সন্দেহ</span> ':''}${x.failed?'<span class="tag bad">ফেল</span>':x.done?'<span class="tag ok">জমা</span>':'<span class="tag">চলছে</span>'}</h2>
  <p>ট্যাব/অ্যাপ বদল: <b style="color:${x.flags?'var(--bad)':'inherit'}">${bn(x.flags||0)} বার</b></p>${(x.log||[]).length?`<p>${esc(x.log.join(', '))}</p>`:''}
  <p>প্রাপ্ত নম্বর: <b>${R[x.id]?bn(R[x.id].score):'—'}</b></p>
  <div class="row"><button class="n" data-a="fail" data-id="${x.id}" data-v="${x.failed?0:1}">${x.failed?'ফেল তুলে নিন':'ফেল করুন'}</button></div></div>`).join('');
}
act.fail=async b=>{await updateDoc(doc(db,'attempts',b.dataset.id),{failed:b.dataset.v==='1'});tabRes()};
act.calc=async b=>{
  b.disabled=true;
  try{
    const e=ex(),key=(await getDoc(doc(db,'exams',e.id,'secret','key'))).data().k;
    const q=await getDocs(query(collection(db,'attempts'),where('examId','==',e.id)));
    const w=writeBatch(db);
    q.docs.forEach(d=>{
      const A=d.data();let sc=0;
      key.forEach((kk,qi)=>{const a=A.ans?.[qi]||'-----';for(let i=0;i<5;i++){const c=a[i];if(c==='-')continue;((c==='T')===(kk[i]==='1'))?sc+=.2:sc-=(e.neg||0)}});
      if(A.failed)sc=0;sc=Math.max(0,Math.round(sc*100)/100);
      w.set(doc(db,'results',d.id),{uid:A.uid,examId:e.id,name:A.name,score:sc,failed:!!A.failed,at:e.s,max:e.qCount,published:!!e.resultsPublished,board:!!(e.resultsPublished&&e.board)});
    });
    await w.commit();toast('গণনা সম্পন্ন');
  }catch(er){toast(er.message)}
  tabRes();
};
async function wipe(col,examId){
  const q=await getDocs(query(collection(db,col),where('examId','==',examId)));
  for(let i=0;i<q.docs.length;i+=400){const w=writeBatch(db);q.docs.slice(i,i+400).forEach(d=>w.delete(d.ref));await w.commit()}
}
act.wipe=async()=>{
  if(!confirm('এই পরীক্ষার সব আবেদন, উত্তর ও ফলাফল মুছে যাবে, ফলাফলের নম্বর থাকবে। নিশ্চিত?'))return;
  for(const c of['apps','attempts'])await wipe(c,AD.id);
  toast('মুছে ফেলা হয়েছে');tabRes();
};
act.wipeall=async()=>{
  if(!confirm('পরীক্ষা, প্রশ্ন, উত্তরমালা ও সব তথ্য মুছে যাবে। নিশ্চিত?'))return;
  for(const c of['apps','attempts','results'])await wipe(c,AD.id);
  const w=writeBatch(db);
  w.delete(doc(db,'exams',AD.id,'qs','main'));w.delete(doc(db,'exams',AD.id,'secret','key'));w.delete(doc(db,'exams',AD.id,'review','main'));w.delete(doc(db,'exams',AD.id));
  await w.commit();AD.id=null;await loadExam();toast('সব মুছে ফেলা হয়েছে');adminView();
};
act.pub=async()=>{
  const e=ex(),on=!e.resultsPublished,board=!!$('#c_b')?.checked,rev=!!$('#c_r')?.checked,w=writeBatch(db);
  (await getDocs(query(collection(db,'results'),where('examId','==',e.id)))).docs.forEach(d=>w.update(d.ref,{published:on,board:on&&board}));
  w.update(doc(db,'exams',e.id),{resultsPublished:on,board,review:rev});
  if(on&&rev){const qs=(await getDoc(doc(db,'exams',e.id,'qs','main'))).data().items,k=(await getDoc(doc(db,'exams',e.id,'secret','key'))).data().k;w.set(doc(db,'exams',e.id,'review','main'),{items:qs.map((q,i)=>({t:q.t,s:q.s,k:k[i]}))})}
  else w.delete(doc(db,'exams',e.id,'review','main'));
  await w.commit();await adminView();
};
act.tobank=async()=>{try{const it=parseQ(val('x_q'));for(let i=0;i<it.length;i+=400){const w=writeBatch(db);it.slice(i,i+400).forEach(q=>w.set(doc(db,'bank',String(hash(q.t))),{t:q.t,s:q.s,k:q.k.map(x=>x?1:0).join('')}));await w.commit()}toast(bn(it.length)+'টি ব্যাংকে জমা হয়েছে')}catch(e){$('#er').textContent=e.message}};
act.frombank=async()=>{
  const q=await getDocs(collection(db,'bank')),L=shuf(q.docs.map(d=>d.data()),Math.random).slice(0,+val('x_bn')||10);
  if(!L.length)return toast('ব্যাংক খালি');
  const t=L.map(x=>[x.t,...x.s.map((s,j)=>s+' | '+(x.k[j]==='1'?'T':'F'))].join('\n')).join('\n\n'),a=$('#x_q');
  a.value=(a.value.trim()?a.value.trim()+'\n\n':'')+t;toast(bn(L.length)+'টি যোগ হয়েছে');
};
async function tabAdm(){
  const q=await getDocs(collection(db,'admins'));
  $('#tabc').innerHTML=`<div class="card"><h2>সহকারী যোগ করুন</h2><small class="h">সহকারী শুধু ড্যাশবোর্ড দেখতে এবং আবেদন অনুমোদন/বাতিল করতে পারবেন। Authentication → Users থেকে তার UID দিন।</small><input id="a_u" placeholder="User UID"><button class="btn" data-a="addadm">সহকারী করুন</button></div>`+
  q.docs.map(d=>`<div class="card"><p style="word-break:break-all">${esc(d.id)} · <b>${d.data().role==='owner'?'মালিক':'সহকারী'}</b></p>${d.id!==S.user.uid?`<div class="row"><button class="n" data-a="rmadm" data-id="${esc(d.id)}">সরান</button></div>`:''}</div>`).join('');
}
act.addadm=async()=>{const u=val('a_u');if(!u)return;await setDoc(doc(db,'admins',u),{role:'helper'});toast('যোগ হয়েছে');tabAdm()};
act.rmadm=async b=>{if(confirm('সরাবেন?')){await deleteDoc(doc(db,'admins',b.dataset.id));tabAdm()}};
</script>
